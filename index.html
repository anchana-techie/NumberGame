/* ---- Scribblio UI ----
   The Scribblio play screen is built once ("shell") and then patched region by region, so the canvas, the
   chat box (focus, typed text) and an in-progress stroke are never destroyed by incoming updates. */
const SK_COLORS=["#000000","#7f7f7f","#e53935","#fb8c00","#fdd835","#43a047","#00acc1","#1e88e5","#8e24aa","#ec407a","#6d4c41","#c8c8c8"];
const SK_SIZES=[3,8,16,28];
let skColor="#000000", skSize=8, skTool="pen", skDraw=null;
const SKC={el:null,ctx:null,strokes:[],tid:"",sid:0};
const SKW=800, SKH=600;
function skPlayView(){ const v=S.room; return !!(S.screen==="room"&&v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"); }
function skCanDraw(){ const v=S&&S.room; return !!(v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"&&v.g.phase==="draw"&&v.g.drawer===v.me); }
function skStrokeDraw(s,from){
  const c=SKC.ctx; c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=s.c; c.lineWidth=s.w;
  for(let i=Math.max(from,0);i<s.p.length;i++){
    const a=s.p[i-1]||s.p[i], b=s.p[i];
    c.beginPath(); c.moveTo(a[0]*SKW,a[1]*SKH); c.lineTo(b[0]*SKW+0.01,b[1]*SKH); c.stroke();
  }
}
function skRedraw(){
  const c=SKC.ctx; c.globalCompositeOperation="source-over"; c.fillStyle="#ffffff"; c.fillRect(0,0,SKW,SKH);
  SKC.strokes.forEach(s=>skStrokeDraw(s,0));
}
function skApply(op){                                      // the only way anything gets drawn on the canvas
  if(!op||!SKC.ctx) return;
  if(op.k==="seg"){
    let s=SKC.strokes[SKC.strokes.length-1];
    if(!s||s.id!==op.id){ s={id:op.id,c:op.c,w:op.w,p:[]}; SKC.strokes.push(s); }
    const from=s.p.length; (op.p||[]).forEach(q=>s.p.push(q)); skStrokeDraw(s,from);
  } else if(op.k==="undo"){ SKC.strokes.pop(); skRedraw(); }
  else if(op.k==="clear"){ SKC.strokes=[]; skRedraw(); }
  else if(op.k==="sync"){ SKC.strokes=(op.strokes||[]).map(s=>({id:s.id,c:s.c,w:s.w,p:s.p.slice()})); skRedraw(); }
}
function skSend(op){
  if(NET.role==="host") hostDraw(S.me.pid,op);
  else if(NET.hostConn&&NET.hostConn.open){ try{ NET.hostConn.send({t:"draw",d:op}); }catch(e){} }
}
function skFlush(){
  const d=skDraw; if(!d) return; d.timer=null;
  if(!d.pending.length) return;
  const op={k:"seg",id:d.id,c:d.c,w:d.w,p:d.pending}; d.pending=[]; skSend(op);
}
function skEndStroke(){ const d=skDraw; if(!d) return; clearTimeout(d.timer); skFlush(); skDraw=null; }
function buildSkCanvas(){
  const cv=document.createElement("canvas"); cv.width=SKW; cv.height=SKH; cv.className="sk-canvas";
  SKC.el=cv; SKC.ctx=cv.getContext("2d"); skRedraw();
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.round(skClamp((e.clientX-r.left)/r.width,0,1)*10000)/10000,Math.round(skClamp((e.clientY-r.top)/r.height,0,1)*10000)/10000]; };
  const push=pts=>{
    const d=skDraw; if(!d||!pts.length) return;
    skApply({k:"seg",id:d.id,c:d.c,w:d.w,p:pts});          // draw locally right away…
    d.pending.push(...pts);                                  // …and send in small batches
    if(!d.timer) d.timer=setTimeout(skFlush,35);
  };
  cv.addEventListener("pointerdown",e=>{
    if(!skCanDraw()||(e.button!==undefined&&e.button>0)) return;
    e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    skEndStroke();
    const eraser=skTool==="eraser";
    skDraw={id:Date.now()*100+(SKC.sid++%100),c:eraser?"#ffffff":skColor,w:eraser?Math.round(skSize*1.8):skSize,pending:[],timer:null};
    push([pos(e)]);
  });
  cv.addEventListener("pointermove",e=>{
    if(!skDraw) return;
    if(!skCanDraw()){ skEndStroke(); return; }
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    push((evs.length?evs:[e]).map(pos));
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>cv.addEventListener(ev,skEndStroke));
}
function skBlanks(mask){
  return [...mask].map(ch=>ch===" "?'<span class="sk-gap"></span>':ch==="_"?'<span class="sk-ch">&nbsp;</span>':`<span class="sk-ch">${esc(ch.toUpperCase())}</span>`).join("");
}
const skSecs=dl=>Math.max(0,Math.ceil((dl-(Date.now()+S.off))/1000));
function skRender(app){
  const v=S.room;
  if(!$("skShell")){
    const host=v.me===v.hostPid;
    app.innerHTML=`<div class="layout wide"><main id="skShell">
      <div class="topbar"><h1 class="title">${GTITLE.Scribblio}</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn secondary" data-a="copyLink">🔗 Invite link</button>
        ${host?`<button class="btn secondary" data-a="exitgame">⏹ Exit game (keep room)</button>`:""}
        <button class="btn secondary" data-a="leave">${host?"✖ Close room":"🚪 Leave room"}</button></div></div>
      <div class="sk-head" id="skHead"></div>
      <div class="sk-board">
        <div class="sk-players" style="grid-area:players"><div class="in" id="skPlayers"></div></div>
        <div style="grid-area:stage;min-width:0"><div class="sk-stage" id="skStage"><div class="sk-overlay" id="skOverlay"></div></div><div id="skTools"></div></div>
        <div class="sk-chat" style="grid-area:chat"><div class="in"><div class="sk-log" id="skLog"></div>
          <div class="sk-chatrow"><input type="text" id="skChat" data-keep maxlength="80" autocomplete="off" placeholder="Type your guess here…"><button class="btn" id="skSend" data-a="skchat">Send</button></div></div></div>
      </div></main></div>`;
    const st=$("skStage"); st.insertBefore(SKC.el,st.firstChild);
    const c=$("skChat"); if(S.ui.skChat) c.value=S.ui.skChat;
  }
  skPatch(v);
}
function skPatch(v){
  const g=v.g, me=v.me, isD=g.drawer===me, has=!!g.guessed[me], drawing=isD&&g.phase==="draw";
  const setH=(id,h)=>{ const el=$(id); if(el&&el._h!==h){ el._h=h; el.innerHTML=h; } };
  if(SKC.tid!==g.tid){ SKC.tid=g.tid; skDraw=null; skApply({k:"clear"}); }   // new turn = blank canvas
  SKC.el.classList.toggle("can",drawing);

  // header: clock | round | word / blanks | room
  const low=g.phase!=="reveal"&&g.deadline&&skSecs(g.deadline)<=5;
  let lbl,body;
  if(g.phase==="choose"){ lbl=isD?"CHOOSE A WORD":"GET READY"; body=`<span class="sk-hint">${isD?"Pick one of the words below":`${pAv(v,g.drawer)} ${esc(pName(v,g.drawer))} is choosing a word…`}</span>`; }
  else if(g.phase==="reveal"){ lbl="THE WORD WAS"; body=g.res&&g.res.word?`<span class="sk-bigword">${esc(g.res.word)}</span>`:`<span class="sk-hint">Turn skipped</span>`; }
  else if(isD){ lbl="DRAW THIS"; body=`<span class="sk-bigword">${esc(g.word)}</span>`; }
  else if(has){ lbl="YOU GUESSED IT!"; body=`<span class="sk-bigword">${esc(g.word)}</span>`; }
  else { lbl="GUESS THIS"; body=skBlanks(g.mask)+`<span class="sk-n" title="Number of letters">${g.lens.join(" ")}</span>`; }
  setH("skHead",`${g.phase==="reveal"?`<div class="sk-clock off">✓</div>`:`<div class="sk-clock ${low?"low":""}" data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</div>`}
    <div class="sk-round">Round ${v.round} of ${v.settings.rounds}</div>
    <div class="sk-word"><div class="sk-lbl">${lbl}</div><div class="sk-blanks" id="skBlanks">${body}</div></div>
    <span class="chip">Room <b>${esc(v.code)}</b></span>`);

  // players (left): rank, name + points, emoji (+ pencil for the drawer)
  const rows=v.players.map((p,i)=>[p,v.scores[p.pid]||0,i]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]);
  setH("skPlayers",rows.map(([p,sc],i)=>{
    const gain=g.gain[p.pid]||0;
    return `<div class="sk-p ${g.guessed[p.pid]?"ok":""} ${p.pid===g.drawer?"drawing":""} ${p.connected?"":"off"} ${p.left?"gone":""}">
      <span class="rk">#${i+1}</span>
      <div class="nm"><span class="${p.pid===me?"me":""}">${esc(p.name)}${p.pid===me?" (You)":""}${p.pid===v.hostPid?" 👑":""}</span>
        <small>${sc} points${gain>0?` <em>+${gain}</em>`:""}${p.left?" · left":!p.connected?" · offline":""}</small></div>
      <span class="av">${p.av}${p.pid===g.drawer?'<i class="pen" title="Drawing">✏️</i>':""}${g.guessed[p.pid]?'<i class="tick">✓</i>':""}</span></div>`;
  }).join(""));

  // overlay on the canvas: word choice / turn result
  let ov="";
  if(g.phase==="choose"){
    ov=isD?`<h3>Choose a word to draw</h3><div class="sk-choices">${g.choices.map((w,i)=>`<button class="btn green" data-a="skpick" data-i="${i}">${esc(w)}</button>`).join("")}</div>
        <div class="mut">A random one is picked in <b data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</b>s</div>`
      :`<h3>${pAv(v,g.drawer)} ${esc(pName(v,g.drawer))} is choosing a word…</h3>`;
  } else if(g.phase==="reveal"&&g.res){
    const r=g.res, ent=Object.entries(r.gain).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    ov=`<h3>${r.word?`The word was <span class="pink">${esc(r.word)}</span>`:"Turn skipped"}</h3>
      ${r.void?`<div class="mut">The drawer left, so nobody scores this turn.</div>`:r.nobody?`<div class="mut">Nobody guessed it 😶</div>`:""}
      ${ent.length?`<div class="sk-rv-list">${ent.map(([pid,pts])=>`<div><span>${pAv(v,pid)} ${esc(pName(v,pid))}${pid===r.drawer?" ✏️":""}</span><b>+${pts}</b></div>`).join("")}</div>`:""}
      <div class="mut">${g.last?"Final results in":"Next turn in"} <b data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</b>s</div>`;
  }
  setH("skOverlay",ov);

  // drawing tools (drawer only)
  setH("skTools",drawing?`<div class="sk-tools">
    <div class="sk-colors">${SK_COLORS.map(c=>`<button class="swatch ${skTool==="pen"&&skColor===c?"active":""}" data-a="skcolor" data-c="${c}" style="background:${c}" title="${c}"></button>`).join("")}</div>
    <div class="sk-sizes">${SK_SIZES.map(z=>`<button class="sz ${skSize===z?"active":""}" data-a="sksize" data-z="${z}" title="Brush size ${z}"><i style="width:${Math.round(4+z*.6)}px;height:${Math.round(4+z*.6)}px"></i></button>`).join("")}</div>
    <div class="sk-btns"><button class="btn secondary ${skTool==="eraser"?"active":""}" data-a="sktool">🧽 Eraser</button>
      <button class="btn secondary" data-a="skundo">↩️ Undo</button><button class="btn secondary" data-a="skclear">🗑️ Clear</button></div></div>`:"");

  // chat (right)
  const nm=pid=>esc(pName(v,pid));
  const lg=$("skLog"), stick=!lg._h||lg.scrollHeight-lg.scrollTop-lg.clientHeight<60;
  setH("skLog",g.chat.map(c=>c.k==="sys"?`<div class="m sys">${esc(c.text)}</div>`
    :c.k==="ok"?`<div class="m ok">✅ ${nm(c.pid)} guessed the word!</div>`
    :c.k==="close"?`<div class="m close">🔥 ${esc(c.text)}</div>`
    :`<div class="m ${c.vis==="guessed"?"priv":""}"><b>${nm(c.pid)}:</b> ${esc(c.text)}</div>`).join(""));
  if(stick) lg.scrollTop=lg.scrollHeight;
  const inp=$("skChat"), btn=$("skSend"), was=inp.disabled;
  inp.disabled=drawing; btn.disabled=drawing;
  inp.placeholder=drawing?"You're drawing…":has?"You guessed it! Chat with the other guessers…":"Type your guess here…";
  if(was&&!drawing&&document.activeElement===document.body) inp.focus();
}
function doSkChat(){
  const el=$("skChat"); if(!el||el.disabled) return;
  const t=el.value.trim(); if(!t) return;
  el.value=""; S.ui.skChat=""; sendAct({a:"chat",text:t});
}

/* ================= SCRATCHPAD (built once so drawings survive re-renders) ================= */
let PAD=null, padCtx=null, padTool="pen", padColor="#ff6b81", padSize=4, padUndo=[];
const PAD_COLORS=["#ffffff","#ff6b81","#46d6a4","#ffcc66","#6cc7ff","#c58bff"];
function padSnapshot(){
  const cv=PAD.querySelector("canvas");
  padUndo.push(padCtx.getImageData(0,0,cv.width,cv.height));
  if(padUndo.length>30) padUndo.shift();
}
function padClear(){
  if(!PAD) return;
  const cv=PAD.querySelector("canvas");
  padCtx.clearRect(0,0,cv.width,cv.height);
  padUndo=[];
}
function buildPad(){
  PAD=document.createElement("div");
  PAD.className="pad";
  PAD.innerHTML=`
    <h3 style="margin:0 0 10px">✏️ Scratchpad</h3>
    <div class="pad-tools">
      <button class="btn secondary" data-tool="pen">✏️ Pen</button>
      <button class="btn secondary" data-tool="eraser">🧽 Eraser</button>
      <button class="btn secondary" data-act="undo">↩️ Undo</button>
      <button class="btn secondary" data-act="clear">🗑️ Clear</button>
    </div>
    <div class="pad-tools">
      ${PAD_COLORS.map(c=>`<button class="swatch" data-pcolor="${c}" style="background:${c}" title="${c}"></button>`).join("")}
      <input type="range" min="1" max="30" value="${padSize}" title="Brush size">
    </div>
    <canvas width="600" height="700"></canvas>`;
  const cv=PAD.querySelector("canvas");
  padCtx=cv.getContext("2d");
  padCtx.lineCap="round"; padCtx.lineJoin="round";
  const refresh=()=>{
    PAD.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===padTool));
    PAD.querySelectorAll(".swatch").forEach(b=>b.classList.toggle("active",b.dataset.pcolor===padColor&&padTool==="pen"));
  };
  PAD.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{ padTool=b.dataset.tool; refresh(); });
  PAD.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{ padColor=b.dataset.pcolor; padTool="pen"; refresh(); });
  PAD.querySelector("[data-act=undo]").onclick=()=>{ const s=padUndo.pop(); if(s) padCtx.putImageData(s,0,0); };
  PAD.querySelector("[data-act=clear]").onclick=()=>{ padSnapshot(); padCtx.clearRect(0,0,cv.width,cv.height); };
  PAD.querySelector("input[type=range]").oninput=e=>padSize=+e.target.value;
  refresh();
  let drawing=false,last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  const stroke=(a,b)=>{
    padCtx.globalCompositeOperation = padTool==="eraser" ? "destination-out" : "source-over";
    padCtx.strokeStyle=padColor;
    padCtx.lineWidth = padTool==="eraser" ? padSize*3 : padSize;
    padCtx.beginPath(); padCtx.moveTo(a[0],a[1]); padCtx.lineTo(b[0]+0.01,b[1]); padCtx.stroke();
  };
  cv.addEventListener("pointerdown",e=>{ drawing=true; cv.setPointerCapture(e.pointerId); padSnapshot(); last=pos(e); stroke(last,last); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pos(e); stroke(last,p); last=p; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{ drawing=false; }));
}

/* ================= RENDER ================= */
function render(){
  const app=$("app"); if(!app||!S) return;
  if(skPlayView()){ skRender(app); renderOverlay(); return; }
  const ae=document.activeElement; let keep=null;
  if(ae&&ae.dataset&&ae.dataset.keep!==undefined&&ae.id) keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  // new Number-game round -> reset the personal colour panel and scratchpad
  const inNum=S.screen==="room"&&S.room&&S.room.game==="number"&&S.room.phase==="play";
  if(inNum){
    const k=S.room.code+"|"+S.room.round;
    if(S.padKey!==k){
      S.padKey=k; padClear();
      S.colors=Object.fromEntries([...Array(10).keys()].map(i=>[i,"None"]));
      S.positions=Object.fromEntries([...Array(10).keys()].map(i=>[i,""]));
    }
  }
  app.innerHTML=`<div class="layout ${inNum?"with-pad":""}"><main>${mainHTML()}</main>${inNum?`<section class="padcol"><div id="padSlot"></div></section>`:""}</div>`;
  const slot=$("padSlot"); if(slot&&PAD) slot.appendChild(PAD);
  app.querySelectorAll("[data-keep]").forEach(el=>{ if(S.ui[el.id]!==undefined) el.value=S.ui[el.id]; });
  bind();
  if(keep){
    const el=$(keep.id);
    if(el){ el.focus(); try{ if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch(e){} }
  } else {
    const c=$("spyClue")||$("guess");
    if(c&&document.activeElement===document.body) c.focus();
  }
  renderOverlay();
}

/* ---- per-render bindings (email games + colour panel) ---- */
function bind(){
  ["Service","Template","Key"].forEach(k=>{ const el=$("cfg"+k); if(el) el.oninput=()=>xmSaveCfg({service:$("cfgService").value.trim(),template:$("cfgTemplate").value.trim(),key:$("cfgKey").value.trim()}); });
  ["Host","User","Cred"].forEach(k=>{ const el=$("turn"+k); if(el) el.oninput=()=>{ try{ localStorage.setItem(TURN_KEY,JSON.stringify({host:$("turnHost").value,user:$("turnUser").value,cred:$("turnCred").value})); }catch(e){} }; });
  // diwali
  $("dwN")&&($("dwN").onchange=e=>{ const c=dwCollect(); S.dw.names=c.names; S.dw.emails=c.emails;
    S.dw.n=Math.min(30,Math.max(2,parseInt(e.target.value)||2)); rosterSave("dw"); render(); });
  $("dwDraw")&&($("dwDraw").onclick=dwDraw);
  $("dwRetry")&&($("dwRetry").onclick=()=>dwRun(true));
  $("dwReset")&&($("dwReset").onclick=()=>{ const o=S.dw; S.dw=Object.assign(dwFresh(),{n:o.n,names:o.names.slice(),emails:o.emails.slice()}); rosterSave("dw"); S.notice=null; render(); });
  document.querySelectorAll("[data-dn]").forEach(el=>el.oninput=e=>{ S.dw.names[+el.dataset.dn]=e.target.value; rosterSave("dw"); });
  document.querySelectorAll("[data-de]").forEach(el=>el.oninput=e=>{ S.dw.emails[+el.dataset.de]=e.target.value; rosterSave("dw"); });
  // christmom
  $("xmN")&&($("xmN").onchange=e=>{ const c=xmCollect(); S.xm.names=c.names; S.xm.emails=c.emails;
    S.xm.n=Math.min(30,Math.max(2,parseInt(e.target.value)||2)); rosterSave("xm"); render(); });
  $("xmDraw")&&($("xmDraw").onclick=xmDraw);
  $("xmRetry")&&($("xmRetry").onclick=()=>xmRun(true));
  $("xmReset")&&($("xmReset").onclick=()=>{ const o=S.xm; S.xm=Object.assign(xmFresh(),{n:o.n,names:o.names.slice(),emails:o.emails.slice()}); rosterSave("xm"); S.notice=null; render(); });
  document.querySelectorAll("[data-xn]").forEach(el=>el.oninput=e=>{ S.xm.names[+el.dataset.xn]=e.target.value; rosterSave("xm"); });
  document.querySelectorAll("[data-xe]").forEach(el=>el.oninput=e=>{ S.xm.emails[+el.dataset.xe]=e.target.value; rosterSave("xm"); });
  // number game personal colour panel
  document.querySelectorAll("select[data-pos]").forEach(el=>el.onchange=e=>{ S.positions[el.dataset.pos]=e.target.value; render(); });
  document.querySelectorAll("select[data-color]").forEach(el=>el.onchange=e=>{ S.colors[el.dataset.color]=e.target.value; render(); });
}

/* ================= EVENT DELEGATION ================= */
function goHome(){ S=freshState(); padClear(); render(); }
function doClue(){
  const t=String(S.ui.spyClue||"").trim();
  if(!t) return toast("Type a clue first.","err");
  S.ui.spyClue=""; sendAct({a:"clue",text:t});
}
function doGuess(){
  const t=String(S.ui.guess||"").trim();
  S.ui.guess=""; sendAct({a:"guess",guess:t});
}
function onAppClick(e){
  const t=e.target.closest("[data-a]"); if(!t||t.disabled) return;
  switch(t.dataset.a){
    case "home": goHome(); break;
    case "go": S.notice=null; S.game=t.dataset.g; S.screen="entry"; render(); break;
    case "goJoin": S.notice=null; S.game=null; S.screen="entry"; render(); break;
    case "goXmas": S.notice=null; S.screen="xmas"; render(); break;
    case "goDiwali": S.notice=null; S.screen="diwali"; render(); break;
    case "create": createRoom(S.game); break;
    case "join": joinRoom(S.ui.joinCode||""); break;
    case "copyLink": copyLink(); break;
    case "leave": leaveRoom(); break;
    case "exitgame":
      showModal({title:"Exit the game?",text:"Everyone stays in the room. You'll go back to the lobby where you can change the settings and start again.",ok:"Exit game",danger:false,act:"exitgame"});
      break;
    case "skchat": doSkChat(); break;
    case "skpick": sendAct({a:"skpick",i:+t.dataset.i}); break;
    case "skcolor": skColor=t.dataset.c; skTool="pen"; skPatch(S.room); break;
    case "sksize": skSize=+t.dataset.z; skPatch(S.room); break;
    case "sktool": skTool=skTool==="eraser"?"pen":"eraser"; skPatch(S.room); break;
    case "skundo": if(skCanDraw()){ skEndStroke(); skApply({k:"undo"}); skSend({k:"undo"}); } break;
    case "skclear": if(skCanDraw()){ skEndStroke(); skApply({k:"clear"}); skSend({k:"clear"}); } break;
    case "start": sendAct({a:"start",civ:S.ui.spyCiv,spyW:S.ui.spyW,words:S.ui.skWords}); break;
    case "act": sendAct({a:t.dataset.x}); break;
    case "clue": doClue(); break;
    case "callvote": sendAct({a:"callvote"}); break;
    case "guess": doGuess(); break;
    case "vote":
      if(!S.ui.voteSel) return toast("Pick a player first.","err");
      sendAct({a:"vote",target:S.ui.voteSel}); break;
    case "rrguess":
      if(!S.ui.rrSel) return toast("Pick a player first.","err");
      sendAct({a:"rrguess",target:S.ui.rrSel}); break;
  }
}
function onAppChange(e){
  const el=e.target.closest("[data-set]"); if(!el) return;
  sendAct({a:"settings",k:el.dataset.set,v:el.value});
}
function onAppInput(e){
  const t=e.target;
  if(t.dataset&&t.dataset.keep!==undefined&&t.id){
    if(t.id==="guess"){ const c=t.value.replace(/\D/g,""); if(c!==t.value) t.value=c; }
    S.ui[t.id]=t.value;
  }
}
function onAppKey(e){
  if(e.key!=="Enter") return;
  const id=e.target.id;
  if(id==="spyClue") doClue();
  else if(id==="guess") doGuess();
  else if(id==="skChat") doSkChat();
  else if(id==="joinCode") joinRoom(S.ui.joinCode||"");
}

/* ================= START ================= */
let ticker=null;
function startApp(){
  S=freshState();
  buildPad(); buildSkCanvas();
  const app=$("app");
  app.addEventListener("click",onAppClick);
  app.addEventListener("change",e=>{ onAppInput(e); onAppChange(e); });
  app.addEventListener("input",onAppInput);
  app.addEventListener("keydown",onAppKey);
  const ov=$("overlay");
  ov.addEventListener("click",onOverlayClick);
  document.addEventListener("keydown",onOverlayKey);
  if(!ticker) ticker=setInterval(()=>{
    document.querySelectorAll("[data-dl]").forEach(el=>{
      const s=Math.max(0,Math.ceil((+el.dataset.dl-(Date.now()+S.off))/1000));
      el.textContent=el.dataset.dlmode==="s"?String(s):"⏱ "+(s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s+"s");
      el.classList.toggle("low",s<=5);
    });
  },250);
  const sess=getSession();
  const q=(new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
  if(sess&&sess.role==="guest"&&sess.code&&S.me.name){            // reconnect after a refresh
    S.screen="entry"; render(); joinRoom(sess.code); return;
  }
  clearSession();
  if(q){ S.screen="entry"; S.game=null; S.ui.joinCode=q; }
  render();
}
startApp();
</script>
